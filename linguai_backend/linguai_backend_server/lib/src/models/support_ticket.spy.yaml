class: SupportTicketRecord
table: support_ticket
fields:
  userId: int
  category: String
  subject: String
  message: String
  priority: String, default='normal'
  status: String, default='open'
  reply: String?
  repliedAt: DateTime?
  createdAt: DateTime
  updatedAt: DateTime
indexes:
  support_ticket_user_idx:
    fields: userId
