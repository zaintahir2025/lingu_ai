<svg width="192" height="194" viewBox="0 0 192 194" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Body Gradient -->
    <linearGradient id="heroRobotBody" x1="30" y1="20" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="50%" stop-color="#D0EBF7"/>
      <stop offset="100%" stop-color="#9AD7EB"/>
    </linearGradient>

    <linearGradient id="heroCyanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <linearGradient id="heroVisor" x1="40" y1="50" x2="150" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2639"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <linearGradient id="goldStar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
  </defs>

  <!-- Aura Glow Behind Head -->
  <circle cx="96" cy="76" r="64" fill="#00E5FF" opacity="0.12"/>

  <!-- Antenna -->
  <rect x="92" y="12" width="8" height="24" rx="4" fill="#64748B"/>
  <circle cx="96" cy="12" r="11" fill="url(#heroCyanGlow)"/>
  <circle cx="96" cy="12" r="4" fill="#FFFFFF"/>

  <!-- Side Ear Speakers -->
  <rect x="32" y="60" width="12" height="28" rx="6" fill="#00B0FF"/>
  <rect x="148" y="60" width="12" height="28" rx="6" fill="#00B0FF"/>

  <!-- Head Chassis -->
  <rect x="40" y="32" width="112" height="90" rx="30" fill="url(#heroRobotBody)" stroke="#94A3B8" stroke-width="3"/>
  <path d="M60 36 C80 33, 112 33, 132 36" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Visor Screen -->
  <rect x="52" y="48" width="88" height="58" rx="20" fill="url(#heroVisor)"/>

  <!-- Glowing LED Eyes -->
  <ellipse cx="76" cy="74" rx="9" ry="12" fill="url(#heroCyanGlow)"/>
  <circle cx="79" cy="71" r="3.5" fill="#FFFFFF"/>

  <ellipse cx="116" cy="74" rx="9" ry="12" fill="url(#heroCyanGlow)"/>
  <circle cx="119" cy="71" r="3.5" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M85 91 Q96 98 107 91" stroke="url(#heroCyanGlow)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Body / Torso -->
  <path d="M66 126 L126 126 L118 168 C118 174 74 174 74 168 Z" fill="url(#heroRobotBody)" stroke="#94A3B8" stroke-width="2.5"/>

  <!-- Chest Emblem -->
  <rect x="84" y="136" width="24" height="18" rx="9" fill="url(#heroCyanGlow)"/>
  <path d="M91 145 L97 145 M94 141 L94 149" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Waving Left Arm/Hand -->
  <circle cx="28" cy="118" r="11" fill="url(#heroRobotBody)" stroke="#00B0FF" stroke-width="3"/>

  <!-- Waving Right Arm/Hand -->
  <circle cx="164" cy="108" r="11" fill="url(#heroRobotBody)" stroke="#00B0FF" stroke-width="3"/>

  <!-- Decorative Sparkles -->
  <path d="M30 40 L34 44 L30 48 L26 44 Z" fill="url(#goldStar)"/>
  <path d="M162 44 L165 47 L162 50 L159 47 Z" fill="url(#goldStar)"/>
</svg>
