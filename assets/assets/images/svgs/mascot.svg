<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Head/Body Gradient -->
    <linearGradient id="robotBody" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EBF8FF"/>
      <stop offset="60%" stop-color="#CFEBF8"/>
      <stop offset="100%" stop-color="#A5D8E8"/>
    </linearGradient>

    <!-- Teal/Mint Accent Gradient -->
    <linearGradient id="mintAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <!-- Dark Glass Visor Gradient -->
    <linearGradient id="visorGlass" x1="30" y1="35" x2="90" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2639"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <!-- Glowing Eye & LED Light Gradient -->
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>

    <!-- Drop Shadow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antenna Rod -->
  <rect x="57" y="10" width="6" height="14" rx="3" fill="#64748B"/>
  <!-- Antenna Glowing Bulb -->
  <circle cx="60" cy="10" r="7" fill="url(#cyanGlow)" filter="url(#softGlow)"/>
  <circle cx="60" cy="10" r="3" fill="#FFFFFF"/>

  <!-- Left & Right Ear Modules -->
  <rect x="18" y="44" width="8" height="18" rx="4" fill="#00B0FF"/>
  <rect x="94" y="44" width="8" height="18" rx="4" fill="#00B0FF"/>

  <!-- Main Head Chassis -->
  <rect x="23" y="22" width="74" height="62" rx="20" fill="url(#robotBody)" stroke="#94A3B8" stroke-width="2"/>
  
  <!-- Metallic Highlight on Top Head -->
  <path d="M35 25 C45 23, 75 23, 85 25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Dark Visor Screen -->
  <rect x="30" y="32" width="60" height="42" rx="14" fill="url(#visorGlass)"/>

  <!-- Visor Subtle Glare -->
  <path d="M34 36 L48 36 L36 50 Z" fill="#FFFFFF" opacity="0.12"/>

  <!-- Left Eye (Glowing LED capsule/arc) -->
  <ellipse cx="46" cy="50" rx="6" ry="8" fill="url(#cyanGlow)"/>
  <circle cx="48" cy="48" r="2.5" fill="#FFFFFF"/>

  <!-- Right Eye (Glowing LED capsule/arc) -->
  <ellipse cx="74" cy="50" rx="6" ry="8" fill="url(#cyanGlow)"/>
  <circle cx="76" cy="48" r="2.5" fill="#FFFFFF"/>

  <!-- Happy LED Smile -->
  <path d="M53 62 Q60 67 67 62" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Robot Body / Base Support -->
  <path d="M40 84 L80 84 L74 104 C74 108 46 108 46 104 Z" fill="url(#robotBody)" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Chest AI Badge / Core Light -->
  <rect x="52" y="89" width="16" height="12" rx="6" fill="url(#mintAccent)"/>
  <path d="M57 95 L63 95 M60 92 L60 98" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left Floating Hand -->
  <circle cx="16" cy="74" r="7" fill="url(#robotBody)" stroke="#00B0FF" stroke-width="2"/>

  <!-- Right Floating Hand (Waving) -->
  <circle cx="104" cy="68" r="7" fill="url(#robotBody)" stroke="#00B0FF" stroke-width="2"/>
</svg>
