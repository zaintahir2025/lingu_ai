<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Head/Body Gradient -->
    <linearGradient id="robotBodySad" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="60%" stop-color="#FFE8B2"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>

    <!-- Warm Amber Accent Gradient -->
    <linearGradient id="amberGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F77F00"/>
    </linearGradient>

    <!-- Dark Visor Glass Gradient -->
    <linearGradient id="visorGlassSad" x1="30" y1="35" x2="90" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241E2B"/>
      <stop offset="100%" stop-color="#120E17"/>
    </linearGradient>

    <!-- Drop Shadow filter -->
    <filter id="softGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Bent Tilted Antenna Rod -->
  <path d="M57 14 L50 6" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <!-- Antenna Bulb -->
  <circle cx="48" cy="5" r="7" fill="url(#amberGlow)" filter="url(#softGlowAmber)"/>
  <circle cx="48" cy="5" r="3" fill="#FFFFFF"/>

  <!-- Left & Right Ear Modules -->
  <rect x="18" y="46" width="8" height="18" rx="4" fill="#F77F00"/>
  <rect x="94" y="44" width="8" height="18" rx="4" fill="#F77F00"/>

  <!-- Main Head Chassis (Slightly tilted) -->
  <g transform="rotate(-3 60 53)">
    <rect x="23" y="22" width="74" height="62" rx="20" fill="url(#robotBodySad)" stroke="#F77F00" stroke-width="2"/>
    
    <!-- Dark Visor Screen -->
    <rect x="30" y="32" width="60" height="42" rx="14" fill="url(#visorGlassSad)"/>

    <!-- Empathetic Droopy LED Eyes -->
    <path d="M40 52 Q46 44 52 52" stroke="url(#amberGlow)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M68 52 Q74 44 80 52" stroke="url(#amberGlow)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Soft Gentle Mouth Curve -->
    <path d="M54 64 Q60 61 66 64" stroke="url(#amberGlow)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Robot Body / Base Support -->
  <path d="M40 84 L80 84 L74 104 C74 108 46 108 46 104 Z" fill="url(#robotBodySad)" stroke="#F77F00" stroke-width="1.5"/>

  <!-- Chest AI Badge / Core Light -->
  <rect x="52" y="89" width="16" height="12" rx="6" fill="url(#amberGlow)"/>
  <circle cx="60" cy="95" r="3" fill="#FFFFFF"/>

  <!-- Hands Rested (Empathetic / Supportive) -->
  <circle cx="28" cy="88" r="7" fill="url(#robotBodySad)" stroke="#F77F00" stroke-width="2"/>
  <circle cx="92" cy="88" r="7" fill="url(#robotBodySad)" stroke="#F77F00" stroke-width="2"/>
</svg>
