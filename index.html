<!DOCTYPE html>
<html>
<head>
  <base href="/lingu_ai/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LinguAI - Industry-grade gamified language learning platform with adaptive AI tutoring and spaced repetition.">
  <meta name="theme-color" content="#20C997">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LinguAI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Animated Piko favicon with a static fallback. -->
  <link rel="icon" type="image/gif" href="favicon.gif?v=3">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="favicon.png?v=3">

  <title>LinguAI | AI-Powered Language Learning</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #F8FAFC;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo-badge {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: linear-gradient(135deg, #20C997 0%, #0F9D58 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(32, 201, 151, 0.35);
      margin-bottom: 24px;
    }
    .logo-badge svg {
      width: 42px;
      height: 42px;
      fill: #FFFFFF;
    }
    .app-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin: 0 0 8px 0;
    }
    .app-subtitle {
      font-size: 14px;
      color: #94A3B8;
      margin: 0 0 32px 0;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .spinner-bar {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .spinner-bar::after {
      content: '';
      position: absolute;
      left: -50%;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #20C997, #38BDF8);
      border-radius: 4px;
      animation: loading-anim 1.5s infinite ease-in-out;
    }
    @keyframes loading-anim {
      0% { left: -50%; width: 30%; }
      50% { left: 35%; width: 60%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <img src="icons/Icon-192.png" alt="LinguAI Official Mascot" style="width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 12px 30px rgba(32, 201, 151, 0.35); margin-bottom: 20px;">
    <h1 class="app-title">LinguAI</h1>
    <p class="app-subtitle">Initializing Enterprise Learning Platform</p>
    <div class="spinner-bar"></div>
  </div>

  <script src="flutter_bootstrap.js?v=6" async></script>
</body>
</html>
