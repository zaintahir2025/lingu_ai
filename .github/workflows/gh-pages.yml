name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Trigger on push to main branch

# Add explicit write permissions so the GITHUB_TOKEN can push to gh-pages branch
permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        # The base-href must match your repository name EXACTLY (with leading and trailing slashes).
        # We pass the production backend URL using dart-define. Wrapped in quotes to prevent bash errors if the secret is empty.
        run: >-
          flutter build web --release --no-wasm-dry-run --base-href /lingu_ai/
          --dart-define=API_URL="${{ secrets.API_URL }}"

      # GitHub Pages can cache main.dart.js after a release. Give every build a
      # content-addressed entrypoint so an older bundle can never mask a fix.
      - name: Fingerprint Flutter entrypoint
        shell: bash
        run: |
          entry_hash="$(sha256sum build/web/main.dart.js | cut -c1-12)"
          entry_name="main.${entry_hash}.dart.js"
          mv build/web/main.dart.js "build/web/${entry_name}"
          perl -0pi -e "s/main\\.dart\\.js/${entry_name}/g" build/web/flutter_bootstrap.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
